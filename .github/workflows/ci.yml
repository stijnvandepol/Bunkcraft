name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  # Typecheck, unit + integration tests with coverage, build and the bundle size budget.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run build
      - name: Bundle size budget (fails on > 10 % growth of the main chunk)
        run: npm run size:check
      - name: Precompressed copies match the built files (the server serves .br/.gz first)
        run: node scripts/check-precompressed.mjs

  # Mesh and arena benchmarks against scripts/perf-budget.json (generous ceilings, CI factor applied).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:perf

  # Browser end-to-end tests: Chromium (SwiftShader software WebGL) and WebKit. Slower, so a job of its own.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install system dependencies only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright report and failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Ready-made multi-arch images on GHCR (docs/SERVER.md): a VPS pulls the image instead of building it.
  # Only for pushes to main and v* tags, and only after every check above passed.
  image:
    needs: [check, perf, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write anything: packages of this repository.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bunkcraft" >> "$GITHUB_OUTPUT"
      # No QEMU: the Dockerfile builds on the runner's own platform and its runtime stage has no RUN step,
      # so the arm64 image is assembled without emulating arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags, OCI labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the multi-arch index too: GHCR reads the description and source from it.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          # Channels a server follows with BUNKCRAFT_TAG (docs/SERVER.md, "Automatisch deployen"):
          # latest = every green push to main; stable = only release tags v1.2.3 (not pre-releases like v1.3.0-rc.1).
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=BunkCraft
            org.opencontainers.image.description=Minecraft-inspired voxel game for the browser, with its multiplayer server
            org.opencontainers.image.licenses=ISC
          annotations: |
            org.opencontainers.image.title=BunkCraft
            org.opencontainers.image.description=Minecraft-inspired voxel game for the browser, with its multiplayer server
            org.opencontainers.image.licenses=ISC
      # Nothing is published unless the amd64 image starts, answers /health and serves the game.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bunkcraft:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (compose hardening, /health, the game page, the API and a throw-away game)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e ADMIN_TOKEN=smoke-test-token -p 127.0.0.1:3000:3000 bunkcraft:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q "\"version\":\"[^\"]*+${GITHUB_SHA:0:7}\""; then
              # The same check a server runs after every deploy (scripts/update.sh).
              docker exec -i smoke node --input-type=module - smoke < scripts/server-check.mjs
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # /health and the title screen show the commit, so you can see what is live.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance and an SPDX SBOM, stored as attestations next to the image (BuildKit makes them for free).
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`. Pin a server to exactly this build with \`BUNKCRAFT_TAG=latest@${DIGEST}\` in its .env."
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional push deploy: right after a new image is published, the server updates over SSH (docs/SERVER.md,
  # "Automatisch deployen"). Off until the repository variable DEPLOY_ENABLED is 'true'; the secrets live in the
  # GitHub Environment "production" (where required reviewers can make every deploy wait for a click).
  # The SSH key can only run 'bunkcraft deploy' on the server (forced command), which follows the server's own
  # channel: a push to main does nothing on a server on BUNKCRAFT_TAG=stable.
  deploy:
    needs: [image]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    # Never two deploys at once, and a queued one is not cancelled by a newer push.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # No token needed: the job only talks to the server.
    permissions: {}
    steps:
      - name: Deploy over SSH (bunkcraft deploy)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Push deploy skipped: set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in the 'production' environment."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # StrictHostKeyChecking=yes: only the pinned host key is accepted. The server ignores the command
          # and runs its forced command; 'deploy' is sent for readability of its logs.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" deploy
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
