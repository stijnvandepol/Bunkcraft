<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BunkCraft: voxel arena shooter</title>
    <meta name="description" content="BunkCraft is a voxel arena shooter in your browser: quick play, 12 modes, 17 maps, bots, ranks and private matches with friends. Free, no install. Includes a Build &amp; Survival sandbox." />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS / Safari: home-screen app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BunkCraft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Social preview (relative URLs are fine for the static build; for a public site set a full URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BunkCraft: voxel arena shooter" />
    <meta property="og:description" content="Drop into a match in your browser: 12 modes, 17 maps, bots, ranks and private matches with friends. Free, no install." />
    <meta property="og:image" content="/icons/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BunkCraft: voxel arena shooter" />
    <meta name="twitter:image" content="/icons/social-preview.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
