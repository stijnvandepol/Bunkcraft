# One container per arena lobby (MATCH_ISOLATION=container). The bunkcraft service becomes the control plane: it
# serves the game, profiles, parties and matchmaking, and starts a match container (same image, ROLE=match) for
# every lobby. Players keep connecting to the control plane only; it forwards their WebSocket to the right match.
#
#   sudo ./scripts/install.sh --match-isolation container        (adds this file to COMPOSE_FILE in .env)
#   or in .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.matches.yml[:docker-compose.direct.yml]
#
# Security model (docs/SECURITY.md, "Socket proxy"): the control plane never sees the Docker socket. It talks to the
# Engine API through docker-socket-proxy, which only lets container calls through (list, inspect, stats, create,
# start, stop): no images, networks, volumes, exec or build. The proxy cannot check what is in a create request, so
# the control plane builds and validates every container spec itself (server/match/ContainerSpec.ts).
#
# Networks:
#   match       internal (no internet): control plane <-> match containers (game traffic and the internal API)
#   docker-api  internal: control plane <-> socket proxy, nobody else
services:
  bunkcraft:
    depends_on:
      docker-proxy:
        condition: service_started
    environment:
      MATCH_ISOLATION: ${MATCH_ISOLATION:-container}
      DOCKER_HOST: http://docker-proxy:2375
      # Fixed name (see networks below), so the control plane can attach match containers to it.
      MATCH_NETWORK: ${MATCH_NETWORK_NAME:-bunkcraft_match}
      # Label on every match container: the control plane only ever lists and adopts containers with it.
      MATCH_OWNER: ${MATCH_OWNER:-bunkcraft}
      CONTROL_URL: http://bunkcraft:3001
      # Per match container (docs/SERVER.md "Een container per lobby"). 1 CPU and 256 MB fit a full 12-player lobby.
      MATCH_CPUS: ${MATCH_CPUS:-1}
      MATCH_MEMORY: ${MATCH_MEMORY:-256m}
      MATCH_PIDS: ${MATCH_PIDS:-64}
      MATCH_WARM_POOL: ${MATCH_WARM_POOL:-1}
      MAX_MATCH_CONTAINERS: ${MAX_MATCH_CONTAINERS:-16}
      MATCH_IDLE_GRACE_SEC: ${MATCH_IDLE_GRACE_SEC:-30}
      # Empty = the image this container runs (looked up at start-up): an update moves new matches to the new build.
      MATCH_IMAGE: ${MATCH_IMAGE:-}
      MATCH_SECRET: ${MATCH_SECRET:-}
    networks:
      - default
      - match
      - docker-api

  docker-proxy:
    # Pinned by digest: a socket proxy is part of the trust boundary. Update deliberately (docs/SECURITY.md).
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    environment:
      # Everything off except containers; POST for create/start/stop only.
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      PING: 1
      VERSION: 1
      EVENTS: 0
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      SESSION: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

networks:
  match:
    name: ${MATCH_NETWORK_NAME:-bunkcraft_match}
    internal: true
  docker-api:
    internal: true
